[package]
name = "thermview"
version = "0.1.0"
description = "Radiometric thermal image analyzer"
authors = ["Quentin PEPE"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "thermview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[features]
# Embeds DJI's Thermal SDK so newer DJI cameras (M3T/M30T/M4T/H20T/H30T) can be
# measured exactly. Off by default: the SDK binaries are not in this repo, see
# DESKTOP.md for how to supply them and why they are not committed.
dji-sdk = ["dep:libloading"]

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
libloading = { version = "0.8", optional = true }

# A smaller binary matters more than compile time for a portable exe.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
